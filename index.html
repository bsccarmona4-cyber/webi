<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webi</title>
  <style>
    :root {
      --bg: #0b0d12;
      --fg: #e8ecf4;
      --muted: #8a93a6;
      --accent: #6ee7b7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #16202e 0%, var(--bg) 55%);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 2rem;
    }
    main {
      max-width: 34rem;
      border: 1px solid #ffffff14;
      border-radius: 1rem;
      padding: 2.5rem;
      background: #ffffff06;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    h1 span { color: var(--accent); }
    p { margin-top: 1rem; color: var(--muted); line-height: 1.6; }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hola, <span>Webi</span>.</h1>
    <p>
      Primera página del repositorio. Hecha desde Kepler con OpenCode y
      publicada en GitHub para probar el flujo completo: código, commit y push.
    </p>
    <footer>
      <span>bsccarmona4-cyber/webi</span>
      <span id="fecha"></span>
    </footer>
  </main>
  <script>
    document.getElementById('fecha').textContent =
      new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
  </script>
</body>
</html>
